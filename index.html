<!DOCTYPE html>
<html>
<head>
  <title>DV Monitoring System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111c33;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #0b1220;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #1e293b;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .card h3 {
      margin: 5px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card span {
      font-size: 20px;
      font-weight: bold;
    }

    .form {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    input, select {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: none;
      outline: none;
      width: 180px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-add {
      background: var(--accent);
      color: black;
    }

    .btn-edit {
      background: var(--warn);
      color: black;
    }

    .btn-del {
      background: var(--danger);
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #1e293b;
      text-align: center;
    }

    th {
      background: #1e293b;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .pending { background: var(--warn); color: black; }
    .paid { background: var(--success); color: black; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-box {
      background: white;
      color: black;
      width: 320px;
      margin: 10% auto;
      padding: 15px;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 10px;
    }
  </style>
</head>

<body>

<header>DV Monitoring System</header>

<div class="container">

  <!-- DASHBOARD -->
  <div class="grid">
    <div class="card">
      <h3>Total DV</h3>
      <span id="totalDV">0</span>
    </div>
    <div class="card">
      <h3>Total Amount</h3>
      <span id="totalAmount">0</span>
    </div>
    <div class="card">
      <h3>Pending</h3>
      <span id="pendingDV">0</span>
    </div>
    <div class="card">
      <h3>Paid</h3>
      <span id="paidDV">0</span>
    </div>
  </div>

  <!-- FORM -->
  <div class="form">
    <input type="date" id="date">
    <input type="text" id="payee" placeholder="Payee">
    <input type="text" id="particulars" placeholder="Particulars">
    <input type="number" id="amount" placeholder="Amount">
    
    <select id="status">
      <option>Pending</option>
      <option>Paid</option>
    </select>

    <button class="btn-add" onclick="addDV()">Add DV</button>
  </div>

  <!-- SEARCH -->
  <div class="form">
    <input type="text" id="search" placeholder="Search Payee..." onkeyup="loadDV()">
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Payee</th>
        <th>Particulars</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Edit DV</h3>

    <input type="hidden" id="editId">
    <input type="text" id="editPayee">
    <input type="text" id="editParticulars">
    <input type="number" id="editAmount">

    <select id="editStatus">
      <option>Pending</option>
      <option>Paid</option>
    </select>

    <br><br>
    <button class="btn-add" onclick="updateDV()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const supabaseUrl = "https://gnznkhzqwapjuruflgwl.supabase.co";
const supabaseKey = "sb_publishable_BHBmNF05IyDIBld1RFEvEA_7iG81ml7";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let dvData = [];

// ADD
async function addDV() {
  await supabaseClient.from("dv_records").insert([{
    date: date.value,
    payee: payee.value,
    particulars: particulars.value,
    amount: amount.value,
    status: status.value
  }]);

  clearForm();
  loadDV();
}

// LOAD
async function loadDV() {
  document.getElementById("table").innerHTML = `<tr><td colspan="6" class="loading">Loading...</td></tr>`;

  let { data } = await supabaseClient
    .from("dv_records")
    .select("*")
    .order("id", { ascending: false });

  dvData = data;

  let search = document.getElementById("search").value.toLowerCase();
  if (search) {
    data = data.filter(d => d.payee.toLowerCase().includes(search));
  }

  let total = 0, pending = 0, paid = 0;

  let html = "";

  data.forEach(d => {
    total += Number(d.amount);
    if (d.status === "Pending") pending++;
    if (d.status === "Paid") paid++;

    html += `
      <tr>
        <td>${d.date}</td>
        <td>${d.payee}</td>
        <td>${d.particulars}</td>
        <td>${d.amount}</td>
        <td>
          <span class="badge ${d.status === 'Paid' ? 'paid' : 'pending'}">
            ${d.status}
          </span>
        </td>
        <td>
          <button class="btn-edit" onclick="editDV(${d.id})">Edit</button>
          <button class="btn-del" onclick="deleteDV(${d.id})">Delete</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = html;

  totalDV.innerText = data.length;
  totalAmount.innerText = total;
  pendingDV.innerText = pending;
  paidDV.innerText = paid;
}

// DELETE
async function deleteDV(id) {
  await supabaseClient.from("dv_records").delete().eq("id", id);
  loadDV();
}

// EDIT
function editDV(id) {
  let row = dvData.find(d => d.id === id);

  editId.value = id;
  editPayee.value = row.payee;
  editParticulars.value = row.particulars;
  editAmount.value = row.amount;
  editStatus.value = row.status;

  modal.style.display = "block";
}

// UPDATE
async function updateDV() {
  await supabaseClient.from("dv_records")
    .update({
      payee: editPayee.value,
      particulars: editParticulars.value,
      amount: editAmount.value,
      status: editStatus.value
    })
    .eq("id", editId.value);

  closeModal();
  loadDV();
}

// MODAL
function closeModal() {
  modal.style.display = "none";
}

// CLEAR FORM
function clearForm() {
  date.value = "";
  payee.value = "";
  particulars.value = "";
  amount.value = "";
  status.value = "Pending";
}

loadDV();
</script>

</body>
</html>
