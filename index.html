<!DOCTYPE html>
<html>
<head>
  <title>Practice ni Pogi DV Monitoring System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #111c33;
      --panel2: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0a1020;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #1e293b;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .tab {
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
    }

    .tab:hover {
      background: #1e293b;
    }

    .tab.active {
      background: var(--accent);
      color: black;
      font-weight: bold;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* DASHBOARD */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--panel);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .card h3 {
      color: var(--muted);
      font-size: 13px;
    }

    .card span {
      font-size: 22px;
      font-weight: bold;
    }

    /* FORM */
    input, select {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #1e293b;
      color: white;
    }

    button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .btn {
      background: var(--accent);
      color: black;
      font-weight: bold;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: var(--panel);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #1e293b;
      text-align: center;
    }

    th {
      background: #1e293b;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .paid { background: var(--success); color: black; }
    .pending { background: var(--warn); color: black; }

    .edit { background: var(--warn); }
    .del { background: var(--danger); color: white; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: var(--panel);
      padding: 20px;
      border-radius: 12px;
      width: 320px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">DV SYSTEM</div>

  <button class="tab active" onclick="showTab('dashboard')">Dashboard</button>
  <button class="tab" onclick="showTab('records')">DV Records</button>
  <button class="tab" onclick="showTab('add')">Add DV</button>
  <button class="tab" onclick="showTab('reports')">Reports</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboard" class="section active">
    <h2>Dashboard</h2>

    <div class="grid">
      <div class="card"><h3>Total DV</h3><span id="totalDV">0</span></div>
      <div class="card"><h3>Total Amount</h3><span id="totalAmount">0</span></div>
      <div class="card"><h3>Pending</h3><span id="pendingDV">0</span></div>
      <div class="card"><h3>Paid</h3><span id="paidDV">0</span></div>
    </div>
  </div>

  <!-- RECORDS -->
  <div id="records" class="section">
    <h2>DV Records</h2>

    <input type="text" id="search" placeholder="Search Payee..." onkeyup="loadDV()">

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Payee</th>
          <th>Particulars</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </div>

  <!-- ADD -->
  <div id="add" class="section">
    <h2>Add DV</h2>

    <input type="date" id="date" placeholder="Date">
    <input type="text" id="payee" placeholder="Payee">
    <input type="text" id="particulars" placeholder="Particulars">
    <input type="number" id="amount" placeholder="Amount">

    <select id="status">
      <option>Pending</option>
      <option>Paid</option>
    </select>

    <button class="btn" onclick="addDV()">Submit DV</button>
  </div>

  <!-- REPORTS -->
  <div id="reports" class="section">
    <h2>Reports</h2>
    <p>Future module: export PDF, analytics, COA reports.</p>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Edit DV</h3>

    <input type="hidden" id="editId">
    <input type="text" id="editPayee">
    <input type="text" id="editParticulars">
    <input type="number" id="editAmount">

    <select id="editStatus">
      <option>Pending</option>
      <option>Paid</option>
    </select>

    <br><br>
    <button class="btn" onclick="updateDV()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const supabaseUrl = "https://gnznkhzqwapjuruflgwl.supabase.co";
const supabaseKey = "sb_publishable_BHBmNF05IyDIBld1RFEvEA_7iG81ml7";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let dvData = [];

/* NAVIGATION */
function showTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

/* ADD */
async function addDV() {
  await supabaseClient.from("dv_records").insert([{
    date: date.value,
    payee: payee.value,
    particulars: particulars.value,
    amount: amount.value,
    status: status.value
  }]);

  loadDV();
  showTab('records');
}

/* LOAD */
async function loadDV() {
  let { data } = await supabaseClient
    .from("dv_records")
    .select("*")
    .order("id", { ascending: false });

  dvData = data;

  let search = document.getElementById("search").value?.toLowerCase() || "";

  if (search) {
    data = data.filter(d => d.payee.toLowerCase().includes(search));
  }

  let total = 0, pending = 0, paid = 0;

  let html = "";

  data.forEach(d => {
    total += Number(d.amount);
    if (d.status === "Pending") pending++;
    if (d.status === "Paid") paid++;

    html += `
      <tr>
        <td>${d.date}</td>
        <td>${d.payee}</td>
        <td>${d.particulars}</td>
        <td>${d.amount}</td>
        <td><span class="badge ${d.status === 'Paid' ? 'paid' : 'pending'}">${d.status}</span></td>
        <td>
          <button class="edit" onclick="editDV(${d.id})">Edit</button>
          <button class="del" onclick="deleteDV(${d.id})">Delete</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = html;

  totalDV.innerText = data.length;
  totalAmount.innerText = total;
  pendingDV.innerText = pending;
  paidDV.innerText = paid;
}

/* DELETE */
async function deleteDV(id) {
  await supabaseClient.from("dv_records").delete().eq("id", id);
  loadDV();
}

/* EDIT */
function editDV(id) {
  let row = dvData.find(d => d.id === id);

  editId.value = id;
  editPayee.value = row.payee;
  editParticulars.value = row.particulars;
  editAmount.value = row.amount;
  editStatus.value = row.status;

  modal.style.display = "flex";
}

/* UPDATE */
async function updateDV() {
  await supabaseClient.from("dv_records")
    .update({
      payee: editPayee.value,
      particulars: editParticulars.value,
      amount: editAmount.value,
      status: editStatus.value
    })
    .eq("id", editId.value);

  closeModal();
  loadDV();
}

/* MODAL */
function closeModal() {
  modal.style.display = "none";
}

loadDV();
</script>

</body>
</html>
